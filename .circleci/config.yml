version: 2.1

jobs:
  build:
    machine:
      image: ubuntu-2404:current
    environment:
      BOOST_VERSION: 1.88.0
    steps:
      - checkout
      - run:
          name: "Say hello"
          command: "echo Hello, World!"
      - setup_remote_docker:
          version: 20.10.7
      - run:
          name: Build using docker
          command: docker build .
workflows:
  say-hello-workflow:
    jobs:
      - build
