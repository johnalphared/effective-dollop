version: 2.1
orbs:
  android: circleci/android@3.2.0
jobs:
  build:
    executor:
      name: android/android_machine
      tag: default
    steps:
      - checkout
      - run:
          name: "Clone repo"
          command: |
            git clone https://gitlab.com/LenaSaenger04/stealth.git
            cd stealth
            git checkout hotfix/json_api_fix
            git config --global user.email "circleci@example.com"
            git config --global user.name "Circleci"
            git merge origin/feature/feature_130 origin/fix/download-audio
      - run:
          name: Setup keystore
          command: |
            sed -i "s/INSERT_YOUR_PASSWORD/${KEYSTORE_PASSWORD}/g" keystore.properties
            mv keystore.properties keystore.jks ./stealth/
      - android/change_java_version:
          distribution: temurin
          java_version: 11
      - run:
          name: Build project
          command: |
            cd stealth
            ./gradlew build -x lint
      - run:
          name: Pack binary
          command: |
            tar cvf stealth.tar.gz -C ./stealth/app/build/outputs/apk/release/ .
      - run:
          name: Upload artifact
          command: 'curl $REPOFLOW_URL -H "Authorization: Bearer $REPOFLOW_PAT" -F "packageFiles=@stealth.tar.gz" -F packageName=stealth -F packageVersion=latest'
workflows:
  mystealth:
    jobs:
      - build