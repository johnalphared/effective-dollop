version: 2.1
orbs:
  win: circleci/windows@5.1.0
jobs:
  build:
    executor: win/server-2022
    steps:
      - checkout
      - run:
          name: Build project
          shell: cmd.exe
          command: |
            & "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\Common7\Tools\VsDevCmd.bat"
            cl  /W4 /Fe:mouse-debouncer.exe mouse-debouncer.c
      - run:
          name: Pack binary
          command: 7z a mouse-debouncer.7z mouse-debouncer.exe
      - run:
          name: Upload artifact
          shell: pwsh.exe
          command: |
            $PSVersionTable
            $form = @{
                packageName  = 'mouse-debouncer'
                packageVersion   = 'latest'
                packageFiles     = Get-Item -Path 'mouse-debouncer.7z'
            }
            $headers = @{
              "Authorization" = "Bearer $env:REPOFLOW_PAT"
            }
            Invoke-WebRequest -Uri $env:REPOFLOW_URL -Headers $headers -Method Post -Form $form
workflows:
  say-hello-workflow:
    jobs:
      - build
