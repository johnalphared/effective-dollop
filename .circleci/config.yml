version: 2.1
orbs:
  win: circleci/windows@5.1.0
jobs:
  build:
    executor: win/server-2022
    steps:
      - checkout
      - run:
          name: "Clone repo"
          command: "git clone https://github.com/marvinlehmann/Mouse-Debouncer.git"
      - run:
          name: "Install SDK"
          command: |
            Invoke-WebRequest -OutFile Install-WindowsSdkISO.ps1 -Uri https://raw.githubusercontent.com/CommunityToolkit/WindowsCommunityToolkit/refs/heads/main/build/Install-WindowsSdkISO.ps1
            .\Install-WindowsSdkISO.ps1 16299
      - run:
          name: Build project
          command: |
            cd "Mouse-Debouncer/Mouse Debouncer"
            $filePath = "Mouse Debouncer.vcxproj"
            msbuild $filePath -property:Configuration=Release
      - run:
          name: Pack binary
          command: 7z a mouse-debouncer.7z "Mouse-Debouncer/Mouse Debouncer/Release"
      - run:
          name: Upload artifact
          command: |
            $PSVersionTable
            $form = @{
                packageName  = 'mouse-debouncer'
                packageVersion   = 'latest'
                packageFiles     = Get-Item -Path 'mouse-debouncer.7z'
            }
            $headers = @{
              "Authorization" = "Bearer $env:REPOFLOW_PAT"
            }
            Invoke-WebRequest -Uri $env:REPOFLOW_URL -Headers $headers -Method Post -Form $form
workflows:
  say-hello-workflow:
    jobs:
      - build
