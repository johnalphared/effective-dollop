version: 2.1
orbs:
  win: circleci/windows@5.1.0
jobs:
  build:
    executor: win/server-2022
    steps:
      - checkout
      - run:
          name: "Clone repo"
          command: "git clone https://github.com/pbatard/rufus"
      - run:
          name: Build project
          command: |
            cd rufus
            msbuild rufus.sln -property:Configuration=Release
      - run:
          name: Pack binary
          command: 7z a rufus.7z ".\rufus"
      - run:
          name: Upload artifact
          shell: pwsh.exe
          command: |
            $PSVersionTable
            $form = @{
                packageName  = 'rufus'
                packageVersion   = 'latest'
                packageFiles     = Get-Item -Path 'rufus.7z'
            }
            $headers = @{
              "Authorization" = "Bearer $env:REPOFLOW_PAT"
            }
            Invoke-WebRequest -Uri $env:REPOFLOW_URL -Headers $headers -Method Post -Form $form
workflows:
  say-hello-workflow:
    jobs:
      - build
