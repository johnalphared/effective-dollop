version: 2.1
orbs:
  android: circleci/android@3.2.0
jobs:
  build:
    executor:
      name: android/android_machine
      tag: default
    steps:
      - run:
          name: "Clone repo"
          command: |
            git clone https://gitlab.com/LenaSaenger04/stealth.git
            cd stealth
            git checkout hotfix/json_api_fix
      - android/change_java_version:
          distribution: temurin
          java_version: 8
      - android/accept_licenses
      - run:
          name: Build project
          command: |
            cd stealth
            ./gradlew tasks
            ./gradlew assembleDebug
      - run:
          name: Pack binary
          command: |
            7z a stealth.7z ./stealth/
workflows:
  mystealth:
    jobs:
      - build