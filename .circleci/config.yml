version: 2.1

jobs:
  build:
    machine:
      image: ubuntu-2404:current
    environment:
      BOOST_VERSION: 1.88.0
      QT_VERSION: 6.9.1
    steps:
      - checkout
      - run:
          name: "Say hello"
          command: "echo Hello, World!"
      - run:
          name: Build using docker
          command: docker buildx build --output . --build-arg BOOST_VERSION --build-arg QT_VERSION .
      - run:
          name: Upload artifact
          command: 'curl $REPOFLOW_URL -H "Authorization: Bearer $REPOFLOW_PAT" -F "packageFiles=@qbt.tar.gz" -F packageName=qbt-static-amd64 -F packageVersion=latest'
workflows:
  say-hello-workflow:
    jobs:
      - build
