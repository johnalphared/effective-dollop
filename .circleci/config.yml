version: 2.1
orbs:
  win: circleci/windows@5.1.0
jobs:
  build:
    executor: win/server-2022
    steps:
      - checkout
      - run:
          name: "Clone repo"
          command: "git clone https://github.com/marvinlehmann/Mouse-Debouncer.git"
      - run:
          name: Install winget
          command: |
            irm asheroto.com/winget | iex
      - run:
          name: Install powershell
          command: |
            winget install --id Microsoft.PowerShell --source winget
      - run:
          name: Build project
          command: |
            cd "Mouse-Debouncer/Mouse Debouncer"
            $filePath = "Mouse Debouncer.vcxproj"
            $sdkVer = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Lib\" | Sort-Object -Descending Name | Select-Object -First 1 -ExpandProperty Name
            msbuild $filePath -property:Configuration=Release /p:WindowsTargetPlatformVersion=$sdkVer
      - run:
          name: Pack binary
          command: 7z a mouse-debouncer.7z "Mouse-Debouncer/Mouse Debouncer/Release"
      - run:
          name: Upload artifact
          command: |
            $PSVersionTable
            $form = @{
                packageName  = 'mouse-debouncer'
                packageVersion   = 'latest'
                packageFiles     = Get-Item -Path 'mouse-debouncer.7z'
            }
            $headers = @{
              "Authorization" = "Bearer $env:REPOFLOW_PAT"
            }
            Invoke-WebRequest -Uri $env:REPOFLOW_URL -Headers $headers -Method Post -Form $form
workflows:
  say-hello-workflow:
    jobs:
      - build
