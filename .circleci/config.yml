version: 2.1
orbs:
  win: circleci/windows@5.1.0
jobs:
  build:
    executor: win/server-2022
    steps:
      - checkout
      - run:
          name: Install winget
          command: |
            irm asheroto.com/winget | iex
      - run:
          name: Install gcc
          command: |
            winget install --id=BrechtSanders.WinLibs.MCF.UCRT
      - run:
          name: Build project
          command: |
            gcc -o mouse-debouncer.exe mouse-debouncer.c -mwindows
      - run:
          name: Pack binary
          command: 7z a mouse-debouncer.7z mouse-debouncer.exe
      - run:
          name: Upload artifact
          command: |
            $PSVersionTable
            $form = @{
                packageName  = 'mouse-debouncer'
                packageVersion   = 'latest'
                packageFiles     = Get-Item -Path 'mouse-debouncer.7z'
            }
            $headers = @{
              "Authorization" = "Bearer $env:REPOFLOW_PAT"
            }
            Invoke-WebRequest -Uri $env:REPOFLOW_URL -Headers $headers -Method Post -Form $form
workflows:
  say-hello-workflow:
    jobs:
      - build
