version: 2.1
orbs:
  win: circleci/windows@4.1
jobs:
  build:
    executor: win/server-2019
    steps:
      - checkout
      - run:
          name: "Clone repo"
          command: "git clone https://github.com/marvinlehmann/Mouse-Debouncer.git"
      - run:
          name: Build project
          command: |
            cd Mouse-Debouncer/Mouse Debouncer
            msbuild "Mouse Debouncer.vcxproj"
#      - run:
#          name: Upload artifact
#          command: 'curl $REPOFLOW_URL -H "Authorization: Bearer $REPOFLOW_PAT" -F "packageFiles=@qbt.tar.gz" -F packageName=qbt-static-amd64 -F packageVersion=latest'
workflows:
  say-hello-workflow:
    jobs:
      - build
